name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: What concrete local-first research workflow is blocked?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable acceptance criteria
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require hosted accounts, multi-tenancy, or arbitrary browser automation.
